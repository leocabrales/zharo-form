<!doctype html><html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ZHARO · Consulta DNI</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--tg-theme-bg-color,#fff);color:var(--tg-theme-text-color,#111);padding:16px 16px 90px}
h1{font-size:20px;margin:0 0 2px;letter-spacing:2px}h1 b{color:#0b3d91}.sub{color:var(--tg-theme-hint-color,#777);font-size:13px;margin-bottom:16px}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
input,select{width:100%;padding:11px;font-size:16px;border:1px solid #ccc;border-radius:10px;background:var(--tg-theme-secondary-bg-color,#f6f6f6);color:inherit}
.err{border-color:#d33}.msg{color:#d33;font-size:12px;min-height:14px}
#send{display:none;width:100%;margin-top:20px;padding:14px;font-size:16px;border:0;border-radius:10px;background:#0b3d91;color:#fff}
</style></head><body>
<h1><b>ZHARO</b></h1><div class="sub">Consulta rápida por DNI (aprobado / no califica)</div>
<label>Agencia</label><input id="agencia" autocomplete="off"><div class="msg" id="m_agencia"></div>
<label>DNI</label><input id="dni" inputmode="numeric" maxlength="8"><div class="msg" id="m_dni"></div>
<label>Año del vehículo</label><select id="anio"><option value="">Elegí el año</option></select><div class="msg" id="m_anio"></div>
<button id="send">Consultar</button>
<script>
const tg=window.Telegram&&Telegram.WebApp;const $=i=>document.getElementById(i);
try{const a=localStorage.getItem("zharo_agencia");if(a)$("agencia").value=a}catch(e){}
const y=new Date().getFullYear()+1,s=$("anio");for(let a=y;a>=2011;a--)s.add(new Option(a,a));
$("dni").oninput=e=>e.target.value=e.target.value.replace(/\D/g,"").slice(0,8);
function v(){let ok=true;const ag=!$("agencia").value.trim();$("agencia").classList.toggle("err",ag);$("m_agencia").textContent=ag?"Completá la agencia":"";if(ag)ok=false;
const bd=!/^\d{7,8}$/.test($("dni").value);$("dni").classList.toggle("err",bd);$("m_dni").textContent=bd?"El DNI tiene que tener 7 u 8 números":"";if(bd)ok=false;
const ba=!$("anio").value;$("anio").classList.toggle("err",ba);$("m_anio").textContent=ba?"Elegí el año":"";if(ba)ok=false;return ok}
function send(){if(!v()){tg&&tg.HapticFeedback&&tg.HapticFeedback.notificationOccurred("error");return}
const data={tipo:"consulta",agencia:$("agencia").value.trim(),dni:$("dni").value,anio:$("anio").value};
try{localStorage.setItem("zharo_agencia",data.agencia)}catch(e){}
if(tg&&tg.sendData&&tg.platform!=="unknown"){tg.sendData(JSON.stringify(data));tg.close()}else alert(JSON.stringify(data))}
if(tg&&tg.MainButton&&tg.platform!=="unknown"){tg.ready();tg.expand();tg.MainButton.setParams({text:"Consultar",color:"#0b3d91",text_color:"#ffffff"});tg.MainButton.onClick(send);tg.MainButton.show()}else{$("send").style.display="block"}
$("send").onclick=send;
</script></body></html>
